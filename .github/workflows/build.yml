name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Filter engine unit tests (also dumps composed shaders)
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --tests "com.darklordgeo.bodycamfx.filters.*" --stacktrace

      - name: Validate every composed GLSL shader with glslang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          for f in app/build/shaders/device/*.frag app/build/shaders/device/*.vert; do
            echo "== $f"
            glslangValidator "$f"
          done

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/BodycamFX-${{ github.run_number }}.apk
          (cd app/build/shaders && zip -qr ../../../out/shaders-${{ github.run_number }}.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: BodycamFX-${{ github.run_number }}
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bodycam FX build ${{ github.run_number }}
          body: |
            Automated build from ${{ github.sha }}.
            Install `BodycamFX-${{ github.run_number }}.apk` on your phone (allow installs from unknown sources).
          files: out/*
          make_latest: true

  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Record Compose screenshots (Robolectric + Roborazzi)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests "com.darklordgeo.bodycamfx.ui.*" -Proborazzi.test.record=true --stacktrace
      - name: Zip screenshots
        if: always()
        run: |
          mkdir -p out
          find app -path '*roborazzi*' -name '*.png' -exec cp {} out/ \; || true
          ls out
      - name: Attach screenshots to the build release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bodycam FX build ${{ github.run_number }}
          files: out/*.png
          fail_on_unmatched_files: false
