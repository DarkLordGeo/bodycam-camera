name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Filter engine unit tests (also dumps composed shaders)
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --tests "com.darklordgeo.bodycamfx.filters.*" --stacktrace

      - name: Validate every composed GLSL shader with glslang
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools && break; sleep 10; done
          for f in app/build/shaders/device/*.frag app/build/shaders/device/*.vert; do
            echo "== $f"
            glslangValidator "$f"
          done

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failed-${{ github.run_number }}
          name: Failed build ${{ github.run_number }}
          files: build-log.txt
          prerelease: true
          make_latest: false

      - name: Collect outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/BodycamFX-${{ github.run_number }}.apk
          (cd app/build/shaders && zip -qr ../../../out/shaders-${{ github.run_number }}.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: BodycamFX-${{ github.run_number }}
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bodycam FX build ${{ github.run_number }}
          body: |
            Automated build from ${{ github.sha }}.
            Install `BodycamFX-${{ github.run_number }}.apk` on your phone (allow installs from unknown sources).
          files: out/*
          make_latest: true

  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Record Compose screenshots (Robolectric + Roborazzi)
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests "com.darklordgeo.bodycamfx.ui.*" -Pscreenshots=true --stacktrace 2>&1 | tee out-shots-log.txt; exit ${PIPESTATUS[0]}
      - name: Zip screenshots
        if: always()
        run: |
          mkdir -p out
          cp app/build/screenshots/*.png out/ || true
          cp out-shots-log.txt out/screenshot-log.txt || true
          ls out
      - name: Attach screenshots to the build release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bodycam FX build ${{ github.run_number }}
          files: |
            out/*.png
            out/screenshot-log.txt
          fail_on_unmatched_files: false
